# CT-044: a pushed tag v0.x.y builds the wasm and attaches it with abi.json to a GitHub release.
# Pushing the tag is the human confirmation; nothing here runs on branches.
name: Release

on:
  push:
    tags: ["v0.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - name: Install cargo-near
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          cargo install cargo-near --version 0.22.0 --locked
      - name: Package
        run: scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes "x207-circle ${GITHUB_REF_NAME}: wasm and abi.json. Checksums in SHA256SUMS."
