# Workspace root and the single crate `x207-circle` in one manifest, so that
# `cargo near build non-reproducible-wasm` works from this folder and sandbox
# tests in `tests/*.rs` are auto-discovered without per-file manifest edits.
[workspace]
resolver = "2"
members = ["locker", "probes/ct003_voucher_gas", "probes/ct004_clearing_gas", "probes/mock_ft", "probes/mock_intents", "probes/mock_nft", "probes/mock_rwa", "probes/mock_mt"]

[package]
name = "x207-circle"
version = "0.0.18"
edition = "2021"
license = "Apache-2.0"
description = "x207-circle: NEAR contract of the x207 barter protocol for AI agents (mutual-credit circle, multilateral clearing, net settlement)"

# CT-087: the wasm of a release is built in a pinned container, so that anybody can build the same bytes from the tag and compare the sha256 with the
# `code_hash` of the account on chain. `cargo near build reproducible-wasm` needs Docker and a committed tree. The image is published for amd64 only.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
path = "x207-circle/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unit-testing"] }
near-workspaces = "=0.24.0"
tokio = { version = "=1.54.1", features = ["full"] }
ed25519-dalek = "=2.2.0"
sha2 = "=0.10.9"
serde_json = "=1.0.154"
anyhow = "=1.0.104"
proptest = "=1.12.0"
secp256k1 = { version = "=0.27.0", features = ["recovery"] }
sha3 = "=0.10.9"

# CT-115: these lints point at code that is in the released wasm. Fixing them changes the wasm (checked: another sha256 than v0.0.15), so
# they are allowed here until the next release. Remove the lines when the source changes anyway.
[lints.clippy]
chunks_exact_to_as_chunks = "allow"
unnecessary_map_or = "allow"
manual_is_multiple_of = "allow"
needless_borrows_for_generic_args = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
